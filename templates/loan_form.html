{% extends "base.html" %}
{% block title %}{{ 'Add' if mode == 'add' else 'Edit' }} Loan{% endblock %}
{% block content %}
<div class="section">
    <h2>{{ 'Add' if mode == 'add' else 'Edit' }} Loan</h2>
    <form method="post">
        <div class="form-row">
            <label for="loan_no">Loan Number</label>
            <input type="number" id="loan_no" name="loan_no" min="1" required
                   value="{{ item.loan_no }}" {{ 'readonly' if mode == 'edit' }}>
        </div>
        <div class="form-row">
            <label for="loan_date">Loan Date</label>
            <input type="date" id="loan_date" name="loan_date" required value="{{ item.loan_date }}">
        </div>
        <div class="form-row">
            <label for="amount">Amount (Rs.)</label>
            <input type="number" id="amount" name="amount" min="0.01" step="0.01" required value="{{ item.amount }}">
        </div>
        <div class="form-row">
            <label for="rate">Interest Rate (% per year)</label>
            <input type="number" id="rate" name="rate" min="0" max="100" step="0.01" required value="{{ item.rate }}">
        </div>
        <div class="form-row">
            <label for="loan_type">Loan Type</label>
            <select id="loan_type" name="loan_type" required>
                <option value="">-- Select type --</option>
                {% for t in loan_types %}
                <option value="{{ t }}" {{ 'selected' if item.loan_type == t }}>{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <label for="branch_code">Issuing Branch</label>
            <select id="branch_code" name="branch_code" required>
                <option value="">-- Select branch --</option>
                {% for b in branch_list %}
                <option value="{{ b.branch_code }}" {{ 'selected' if item.branch_code | string == b.branch_code | string }}>
                    {{ b.branch_code }} - {{ b.branch_location }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <label for="employee_id">Handling Employee (optional)</label>
            <select id="employee_id" name="employee_id">
                <option value="">-- None --</option>
                {% for e in employee_list %}
                <option value="{{ e.employee_id }}" {{ 'selected' if item.employee_id | string == e.employee_id | string }}>
                    {{ e.employee_id }} - {{ e.employee_name }} ({{ e.designation }}, branch {{ e.branch_code }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <label for="customer_ids">Borrower(s)</label>
            <select id="customer_ids" name="customer_ids" multiple required>
                {% for c in customer_list %}
                <option value="{{ c.customer_id }}" {{ 'selected' if c.customer_id | string in selected }}>
                    {{ c.customer_id }} - {{ c.customer_name }}
                </option>
                {% endfor %}
            </select>
            <div class="hint">Hold Ctrl (Windows) or Cmd (Mac) to select co-borrowers.</div>
        </div>
        <button type="submit">{{ 'Add Loan' if mode == 'add' else 'Save Changes' }}</button>
        <a class="button grey" href="{{ url_for('loans') }}">Cancel</a>
    </form>
</div>
{% endblock %}
