{% extends "base.html" %}
{% block title %}{{ 'Add' if mode == 'add' else 'Edit' }} Branch{% endblock %}
{% block content %}
<div class="section">
    <h2>{{ 'Add' if mode == 'add' else 'Edit' }} Branch</h2>
    <form method="post">
        <div class="form-row">
            <label for="branch_code">Branch Code</label>
            <input type="number" id="branch_code" name="branch_code" min="1" required
                   value="{{ item.branch_code }}" {{ 'readonly' if mode == 'edit' }}>
        </div>
        <div class="form-row">
            <label for="branch_location">Branch Location</label>
            <input type="text" id="branch_location" name="branch_location" maxlength="150" required
                   value="{{ item.branch_location }}">
        </div>
        <div class="form-row">
            <label for="bank_code">Bank</label>
            <select id="bank_code" name="bank_code" required>
                <option value="">-- Select bank --</option>
                {% for k in banks %}
                <option value="{{ k.bank_code }}" {{ 'selected' if item.bank_code | string == k.bank_code | string }}>
                    {{ k.bank_name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit">{{ 'Add Branch' if mode == 'add' else 'Save Changes' }}</button>
        <a class="button grey" href="{{ url_for('branches') }}">Cancel</a>
    </form>
</div>
{% endblock %}
