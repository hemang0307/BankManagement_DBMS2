{% extends "base.html" %}
{% block title %}{{ 'Add' if mode == 'add' else 'Edit' }} Employee{% endblock %}
{% block content %}
<div class="section">
    <h2>{{ 'Add' if mode == 'add' else 'Edit' }} Employee</h2>
    <form method="post">
        <div class="form-row">
            <label for="employee_id">Employee ID</label>
            <input type="number" id="employee_id" name="employee_id" min="1" required
                   value="{{ item.employee_id }}" {{ 'readonly' if mode == 'edit' }}>
        </div>
        <div class="form-row">
            <label for="employee_name">Employee Name</label>
            <input type="text" id="employee_name" name="employee_name" maxlength="100" required
                   value="{{ item.employee_name }}">
        </div>
        <div class="form-row">
            <label for="designation">Designation</label>
            <input type="text" id="designation" name="designation" maxlength="50" required
                   value="{{ item.designation }}">
            <div class="hint">For example: Branch Manager, Cashier, Clerk, Loan Officer</div>
        </div>
        <div class="form-row">
            <label for="salary">Salary (Rs.)</label>
            <input type="number" id="salary" name="salary" min="0" step="0.01" required value="{{ item.salary }}">
        </div>
        <div class="form-row">
            <label for="branch_code">Branch</label>
            <select id="branch_code" name="branch_code" required>
                <option value="">-- Select branch --</option>
                {% for b in branch_list %}
                <option value="{{ b.branch_code }}" {{ 'selected' if item.branch_code | string == b.branch_code | string }}>
                    {{ b.branch_code }} - {{ b.branch_location }}
                </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit">{{ 'Add Employee' if mode == 'add' else 'Save Changes' }}</button>
        <a class="button grey" href="{{ url_for('employees') }}">Cancel</a>
    </form>
</div>
{% endblock %}
